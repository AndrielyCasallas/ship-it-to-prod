[project]
name = "community-telegram-backend"
version = "0.1.0"
description = "Backend modular para comunidad, eventos y bot de Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.1.1",
    "python-telegram-bot>=22.8",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
