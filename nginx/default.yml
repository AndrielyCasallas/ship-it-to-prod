
# NGINX INGRESS CONFIGURATION
# Enruta / hacia Next.js (Puerto 3000) y /api/ hacia FastAPI (Puerto 8000)
server {
    listen 80;
    server_name localhost;

    # Optimización de buffers para peticiones HTTP
    client_max_body_size 10M;

    # 1. Ruteo hacia la UI (Next.js Standalone)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        
        # WebSockets / HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Propagation Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Ruteo transparente hacia la API (FastAPI)
    location /api/ {
        # Reescribe /api/users -> http://backend:8000/api/users
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        # Header Propagation
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para conexiones de Webhooks/Polling
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}