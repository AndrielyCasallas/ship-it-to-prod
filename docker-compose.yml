
# DOCKER COMPOSE: STACK DE PRODUCCIÓN (STAGING LOCAL / HOMELAB)
# Arquitectura: Next.js Standalone + FastAPI (uv) + Nginx Ingress + Persistent Volume
services:
  # SERVICIO 1: BACKEND (FastAPI + Bot de Telegram + SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aws_builder_backend
    restart: unless-stopped
    
    # Carga de variables de entorno (no expone secretos en el repositorio)
    env_file:
      - ./backend/.env
      
    volumes:
      # Persistencia de la base de datos SQLite en volumen administrado por Docker
      # Corresponde a la variable DATABASE_URL="sqlite:////app/data/community.db"
      - sqlite_data:/app/data

    # Aislamiento de red: Solo accesible internamente por el proxy y frontend
    networks:
      - app-net

    # Healthcheck nativo sin depender de 'curl' (usa la Standard Library de Python)
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['API_KEY']}); urllib.request.urlopen(request)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # SERVICIO 2: FRONTEND (Next.js Standalone Node Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Pasa los ARGs en build-time para quemar NEXT_PUBLIC_* en el bundle JS
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_API_KEY: clave1
    container_name: aws_builder_frontend
    restart: unless-stopped
    
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_API_KEY: clave1

    # Garantiza que el backend esté respondiendo '200 OK' antes de levantar el frontend
    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app-net

    # Healthcheck nativo usando el runtime de Node.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # SERVICIO 3: INGRESS PROXY (Nginx Reverse Proxy)
  # Único punto de entrada expuesto al host / Cloudflare Tunnel (Puerto 80)
  proxy:
    image: nginx:alpine-slim
    container_name: aws_builder_proxy
    restart: unless-stopped
    
    # Expone el puerto 80 del servidor Debian / Homelab
    ports:
      - "80:80"

    # Monta la configuración personalizada de Nginx en modo solo lectura (:ro)
    volumes:
      - ./nginx/default.yml:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - app-net

# RECURSOS COMPARTIDOS (REDES Y VOLÚMENES)
volumes:
  # Volumen persistente administrado para el archivo .db de SQLite
  sqlite_data:
    name: community_sqlite_data

networks:
  # Red virtual aislada tipo 'bridge' con servidor DNS interno habilitado
  app-net:
    name: community_app_net
    driver: bridge